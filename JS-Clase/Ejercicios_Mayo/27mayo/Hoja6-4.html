<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
/*Diseña un script que vaya leyendo números y guardándolos en un array. Una vez lleno mostrará el array y deberá decir cuantos números son pares y cuantos son impares. La entrada de datos termina cuando el usuario
teclea 0 o un valor no numérico.

Intenta resolverlo sin usar métodos del objeto array, solo indices y longitudes de arrays. No debe aceptar valores no numéricos (isNaN(valor) permite detectar valores no numéricos).
Por ejemplo si tecleo: 3,5,4,6,7,8, 11 el script me dirá que el array de entrada es [3,5,4,6,7,8, 11] y que hay 3 pares y 4 impares.*/

    function parImpar(){
        let sw = 0
        let numeros = []
        let pares = 0
        let impares = 0

        while (sw == 0){
            let numero = parseInt(prompt("Dame un número: "));

            if(numero == 0 || isNaN(numero)){
                sw = 1
                document.write(numeros)
            }else{
                numeros.push(numero);
            }

        }
        for (i = 0; i < numeros.length; i++){
            if (numeros[i]%2 == 0){
                pares++
            }else{
                impares++
            }
        }
        document.write("<br>Pares: " +pares+"<br>Impares: "+impares)
    }

    parImpar()

    </script>
</body>
</html>
