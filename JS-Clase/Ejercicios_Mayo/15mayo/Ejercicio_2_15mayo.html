<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="1">
    <input type="text" id="2">
    <input type="text" id="3">
    <input type="text" id="4">
    <input type="text" id="5">
    <input type="text" id="6">
    <input type="text" id="7">
    <input type="text" id="8">
    <button onclick="operar()">+</button>
    <span id="resultado"></span>


    <script>
    /*Pedir 8 numeros en un formulario y visualizar su suma*/
        function operar() {
            let suma = 0
            for(i=1; i<=8; i++){
                suma += parseFloat(document.getElementById(i).value)
            }

            document.getElementById('resultado').innerHTML = "Resultado = " +suma;
        }

    </script>
</body>
</html>
