<body>
    <script>
    /*Declarar un array con valores numericos obtener si el array esta ordenado ascendentemente si o no utilizar el switch*/
       
    let numeros = [1, 2, 12, 4, 5, 123];
    ordenados(numeros);

    function ordenados(numeros) {
        let sw = 0;        
        let i = 1;
        let ascendente = true;  

        while (sw == 0) {
            if (i == numeros.length) {
                sw = 1;
            } else {                
                if (numeros[i] < numeros[i-1]) {
                    sw = 1;
                    ascendente = false;
                }
            }
            i++;
        }

        if (ascendente == true) {
            document.write('Ordenado ascendentemente');
        } else {
            document.write('No esta ordenado ascendentemente');
        }
    }

    </script>
</body>
