<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Medias-2</title>
</head>
<body>  
    <script>
        let mat_notas = [["daniel", 9, 1, 2], ["marcos", 6, 8, 9]];

        function calcularMedia(notas) {
            let mayorMedia = 0
            let mejorAlumno = []
            
            for(let i = 0; i < notas.length; i++) {
                let nombre = notas[i][0]; 
                let suma = 0;
                let cantidadNotas = notas[i].length - 1; 

                for(let j = 1; j < notas[i].length; j++) {
                    suma += notas[i][j];
                } 
                
                let media = suma / cantidadNotas;
                if (media > mayorMedia){
                    mayorMedia+= media
                    mejorAlumno = [nombre,media]
                }
            }
            return mejorAlumno           
        }
        function visualizar(lista) {
                        document.write("La media de " + lista[0] + " es: " + lista[1] + "<br>");           
                }
        
        visualizar(calcularMedia(mat_notas))
    </script>
</body>
</html>
