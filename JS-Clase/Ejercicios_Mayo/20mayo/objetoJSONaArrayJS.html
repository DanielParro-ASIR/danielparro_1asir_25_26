<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let text = `{"alumnos":[
        {"nombre":"Luis","nota":7},
        {"nombre":"Sara","nota":8},
        {"nombre":"Dani","nota":10}]
        }`;

        const objeto_alumnos = JSON.parse(text);

        function guardarAlumnos() {
            array_objeto_alumnos=[]

            for (const key in objeto_alumnos.alumnos){
                array_objeto_alumnos.push(objeto_alumnos.alumnos[key]);
            }
            }

        function mostrarAlumnos(){
            for(i=0;i<array_objeto_alumnos.length;i++){
                document.write(array_objeto_alumnos[i].nombre +": " + array_objeto_alumnos[i].nota + "<br>")
            }
        }

        guardarAlumnos()
        mostrarAlumnos()

    </script>
</body>
</html>
