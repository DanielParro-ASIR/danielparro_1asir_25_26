<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1-8Abril</title>
</head>
<body>
    <script>
    /*Dado dos numeros enteros visualizar los comprendidos entre ambos y cuantos valores negativos hay*/
    /*Toda la función se ejecutara si el numero1 es menor al numero2 sino dará un mensaje de error*/
    
        let numero1 = parseInt(prompt('Dame el primer numero: '));
        let numero2 = parseInt(prompt('Dame el segundo numero: '));   
        Visualizar(numero1, numero2);

        function Visualizar(numero1, numero2){
            let contador = 0
            if(numero1 > numero2){
                document.write('Error')
            }else{
                for (let i=numero1 +1; i <=numero2-1; i++){
                    document.write(i+' ');
                    if (i < 0){
                        contador++
                    }
                }
                document.write('<br>' + 'Negativos = ' + contador);
                document.write('<br>');                
        };
        }
    </script>
</body>
</html>
