<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const alumnos = [
            ["Ana", [8,7,9]],
            ["Luis", [5,6,7]],
            ["Pedro", [10,9,8]]
        ]
        function visualizar1(alumnos){
            for(i = 0; i < alumnos.length;i++){
                document.write(alumnos[i][0] + " ")
            }
        };


        function visualizar2(alumnos){
            for(i = 0; i < alumnos.length;i++){
                document.write(alumnos[i][1] + " ")
            }
        };

        function visualizar3(alumnos){
            let suma = 0
            for(i = 0; i < alumnos.length;i++){
                for(j = 1; j < alumnos[i].length;j++){
                    for(k = 0; k < alumnos[i][j].length;k++){
                        suma += alumnos[i][j][k]
                    }
                    document.write(alumnos[i][0]+": "+suma + " ")
                    suma = 0
                }
            }
        };

        function visualizar4(alumnos){
            let suma = 0
            for(i = 0; i < alumnos.length;i++){
                for(j = 1; j < alumnos[i].length;j++){
                    for(k = 0; k < alumnos[i][j].length;k++){
                        suma += alumnos[i][j][k]
                    }
                    let media = suma / alumnos[i][j].length
                    document.write(alumnos[i][0]+": "+media + " ")
                    suma = 0

                }
            }
        }

        visualizar1(alumnos);
        document.write("--->NOMBRE" +"<br>") 
        visualizar2(alumnos);
        document.write("--->NOTAS" +"<br>") 
        visualizar3(alumnos);
        document.write("--->SUMA NOTAS" +"<br>") 
        visualizar4(alumnos);
        document.write("--->MEDIA NOTAS" +"<br>") 
    </script>
</body>
</html>
