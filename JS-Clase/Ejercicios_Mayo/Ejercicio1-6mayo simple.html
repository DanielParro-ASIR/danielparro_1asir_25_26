<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Medias-1</title>
</head>
<body>  
    <script>
        let tab_notas = ["daniel", 5, 6, 2];

        function calcularMedia(notas) {
            let suma = 0;
            for(let i = 0; i < notas.length; i++) {
                suma += notas[i]
            }
            let media= suma / (notas.length -1)
            return [notas[0],media]
        }
        
        function visualizar(tab){
            document.write(tab[0]+" tiene "+ tab[1])            
        }
        
        visualizar(calcularMedia(tab_notas))
    </script>
</body>
</html>
