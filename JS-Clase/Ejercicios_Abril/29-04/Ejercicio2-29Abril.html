<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2-29Abril</title>
</head>
<body>
    <script>
    let matriz_sueldos = [["Pepe", 800, 2300, 1900], ["Ana", 2000, 1500, 4000], ["Juan", 900, 3200, 5000]];

    function totalSueldos(matriz_sueldos) {
 
        for (let i = 0; i < matriz_sueldos.length; i++) {
            let suma = 0
            for (let j = 1; j < matriz_sueldos[i].length; j++) {
                suma += matriz_sueldos[i][j]
            }
            document.write(matriz_sueldos[i][0] + " total: "+ suma + "<br>")    
        }
    }
    totalSueldos(matriz_sueldos);
    </script>
</body>
</html>
