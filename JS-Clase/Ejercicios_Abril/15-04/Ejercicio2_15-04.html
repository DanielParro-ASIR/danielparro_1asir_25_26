<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-04_Ejercicio2</title>
</head>
<body>
    <script>
    /*Se piden notas de forma repetida al usuario hasta -99, en ese momento visualizar las notas introducidas*/
       
        Visualizar(Notas());
        
        function Notas(){
            let nota = 0
            let sw = 0;            
            let tab_notas = [];

            while(sw == 0){
                nota = parseInt(prompt('Dame nota: '))
                if(nota == -99){
                    sw = 1;
                }else{
                    tab_notas.push(nota)
                }
            }
            return tab_notas;
        }

        function Visualizar(numeros){
            document.write('Los numeros son ' + numeros)
        }

    </script>
</body>
</html>
