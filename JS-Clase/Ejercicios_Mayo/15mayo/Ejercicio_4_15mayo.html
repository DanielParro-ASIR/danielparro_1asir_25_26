<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio4</title>
</head>
<body>
    Nombre-><input type="text" id="Nombre">
    Nota-><input type="text" id="Notas">
    <button onclick="addAlumno()">añadir</button>
    <button onclick="mostrarResultado()">MostrarResultados</button><br>
    <span id="resultado"></span>


    <script>
    let alumnos = []
        function addAlumno() {
            let objeto = {
                nombreAlumno: document.getElementById("Nombre").value,
                notaAlumno: document.getElementById("Notas").value
            };
            alumnos.push(objeto)
            document.getElementById("Nombre").value = ""
            document.getElementById("Notas").value = ""
        }
        /*Yo en vez de mostrar cuandos objetos hay en el array, muestro los resultados*/
        function mostrarResultado(){
            let contenido = "";
                for (let i = 0; i < alumnos.length; i++) {
                    contenido += "Alumno: " + alumnos[i].nombreAlumno + " - Nota: " + alumnos[i].notaAlumno + "<br>";
                }
                document.getElementById("resultado").innerHTML = contenido;
        }
        

    </script>
</body>
</html>
