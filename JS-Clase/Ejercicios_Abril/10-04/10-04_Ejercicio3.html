<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-04_Ejercicio3</title>
</head>
<body>
    <script>
    /*Declarar un array con notas visualizar las notas aprobadas utilizando un switch */
        let notas = [5,6,7,3,2,1]
        visualizar(notas);
        function visualizar(notas){
            let sw = 0;
            let i = 0;
            while (sw == 0){
                if (notas[i] >= 5){
                    document.write(notas[i] + " ")
                }
                if (i == notas.length){
                    sw = 1
                }
                i++
            }
        }
    </script>
</body>
</html>
