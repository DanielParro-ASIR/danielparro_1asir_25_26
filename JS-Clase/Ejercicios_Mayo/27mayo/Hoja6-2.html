<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //Crea una función que reciba el array y una edad mínima. Debe retornar un array con los nombres de las personas que sean mayores o iguales a esa edad
        const usuarios = [ 
        { nombre: "Ana", edad: 25 }, 
        { nombre: "Luis", edad: 17 }, 
        { nombre: "María", edad: 30 }, 
        { nombre:"Juan", edad: 19 } 
    ];
    let modelo=20
    let tab = []
    function edadMinima(){
        for(let persona of usuarios){
            if(persona.edad >= modelo){
                tab.push(persona.nombre)
            }
        }
        document.write(tab)       
    }
    edadMinima();

    </script>
</body>
</html>
